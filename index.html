<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Наша команда / Our team</title>
<meta name="description" content="Наша команда / Our team">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{--bg:#e8edf3;--card:#fff;--ink:#14213d;--muted:#5b6678;--accent:#1d4ed8;--accent-ink:#fff;--line:#d5dce6}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--card:#17202f;--ink:#eef2f8;--muted:#9aa6ba;--accent:#5b8cff;--accent-ink:#0e1522;--line:#27334a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
main{width:100%;max-width:420px}

/* card */
.card{background:var(--card);border-radius:28px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.hero{position:relative;aspect-ratio:4/5;background:var(--accent);display:flex;align-items:flex-end;color:#fff}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ini{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:800;color:var(--accent-ink);opacity:.9}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,16,28,.85) 0%,rgba(10,16,28,0) 60%)}
.cap{position:relative;z-index:1;padding:24px;text-align:left}
.cap h1{margin:0;font-size:28px;line-height:1.15;color:#fff;font-weight:800}
.cap .name-en{margin:2px 0 10px;font-size:17px;font-weight:600;opacity:.85}
.cap .role{margin:0;font-weight:600;opacity:.95}
.cap .role-en{margin:2px 0 0;font-size:14px;opacity:.8}
.body{padding:22px 24px 24px}
.bio{margin:0 0 20px;line-height:1.6;white-space:pre-line}
.bio.en{color:var(--muted);padding-top:18px;border-top:1px solid var(--line)}
.links{display:grid;gap:10px;margin-top:8px}
.links a{display:block;padding:14px 18px;border-radius:16px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;text-align:center}
.links a small{display:block;margin-top:2px;font-weight:400;font-size:13px;opacity:.75}
.links a:hover,.links button:hover{border-color:var(--accent)}
.links a:focus-visible,.links button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.links .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.links button{display:block;width:100%;padding:14px 18px;border-radius:16px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;text-align:center;cursor:pointer}
.links button small{display:block;margin-top:2px;font-weight:400;font-size:13px;opacity:.75}
.links button .chev{display:inline-block;margin-left:8px;transition:transform .2s}
.links button[aria-expanded=true] .chev{transform:rotate(180deg)}
.phones{display:grid;gap:8px;margin-top:10px}
.phones[hidden]{display:none}
.phones a{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:12px 16px;border-radius:14px;background:var(--bg);border:1.5px solid transparent}
.phones a span{color:var(--muted);font-weight:600;font-size:14px}
.phones a span em{display:block;font-style:normal;font-weight:400;font-size:12px}
.phones a b{font-weight:800;white-space:nowrap}

/* list */
.top{margin:8px 4px 20px}
.top h1{margin:0 0 4px;font-size:28px;font-weight:800}
.top p{margin:0;color:var(--muted)}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--card);color:var(--ink);text-decoration:none;box-shadow:0 1px 0 var(--line)}
.row:hover{outline:2px solid var(--accent)}
.row:focus-visible{outline:3px solid var(--accent)}
.row b{display:block;font-weight:800}
.row .en{display:block;font-weight:600;color:var(--muted);font-size:14px}
.row span.r{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.photo{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:20px;font-weight:800;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}

.back{display:inline-block;margin:0 0 14px 4px;color:var(--muted);text-decoration:none;font-weight:600}
.back:hover{color:var(--accent)}
.msg{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<main id="app"><p class="msg">Загрузка… / Loading…</p></main>
<script>
(function(){
  var app=document.getElementById('app');

  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
  function hashId(){
    var h=location.hash.replace('#','');
    try{h=decodeURIComponent(h)}catch(e){}
    return h.trim()||new URLSearchParams(location.search).get('id')||'';
  }
  function src(p){return esc(String(p).replace(/^\/+/,''))}
  function initials(n){return String(n||'').split(' ').filter(Boolean).map(function(w){return w[0]}).slice(0,2).join('')}

  function avatar(e){
    return e.photo
      ? '<div class="photo"><img src="'+src(e.photo)+'" alt="" width="56" height="56" loading="lazy" decoding="async"></div>'
      : '<div class="photo">'+esc(initials(e.name))+'</div>';
  }

  function home(list){
    document.title='Наша команда / Our team';
    app.innerHTML=
      '<header class="top"><h1>Наша команда</h1><p>Our team · выберите сотрудника / choose a person</p></header>'+
      '<nav class="list">'+list.map(function(e){
        return '<a class="row" href="#'+encodeURIComponent(e.id)+'">'+avatar(e)+
          '<div><b>'+esc(e.name)+'</b>'+
          (e.name_en?'<span class="en" lang="en">'+esc(e.name_en)+'</span>':'')+
          '<span class="r">'+esc(e.role)+(e.role_en?' · <span lang="en">'+esc(e.role_en)+'</span>':'')+'</span></div></a>';
      }).join('')+'</nav>';
    window.scrollTo(0,0);
  }

  function card(e){
    document.title=e.name+(e.name_en?' / '+e.name_en:'')+' — '+e.role;
    var items=[];
    var phones=(e.phones||[]).filter(function(p){return p.number});
    if(phones.length){
      items.push('<div class="call"><button type="button" class="callbtn" aria-expanded="false" aria-controls="phones">Позвонить<span class="chev" aria-hidden="true">▾</span><small lang="en">Call</small></button>'+
        '<div class="phones" id="phones" hidden>'+phones.map(function(p){
          var tel=String(p.number).replace(/[^\d+]/g,'');
          return '<a href="tel:'+esc(tel)+'"><span>'+esc(p.label||'')+(p.label_en?'<em lang="en">'+esc(p.label_en)+'</em>':'')+'</span><b>'+esc(p.number)+'</b></a>';
        }).join('')+'</div></div>');
    }
    (e.links||[]).filter(function(l){return l.url&&l.label}).forEach(function(l){
      items.push('<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+(l.label_en?'<small lang="en">'+esc(l.label_en)+'</small>':'')+'</a>');
    });
    var links=items.join('');

    var pic=e.photo
      ? '<img src="'+src(e.photo)+'" alt="'+esc(e.name)+'" width="1000" height="1250" fetchpriority="high" decoding="async">'
      : '<div class="ini">'+esc(initials(e.name))+'</div>';

    app.innerHTML=
      '<section class="card"><div class="hero">'+pic+
        '<div class="cap"><h1>'+esc(e.name)+'</h1>'+
        (e.name_en?'<p class="name-en" lang="en">'+esc(e.name_en)+'</p>':'')+
        '<p class="role">'+esc(e.role)+'</p>'+
        (e.role_en?'<p class="role-en" lang="en">'+esc(e.role_en)+'</p>':'')+
        '</div></div>'+
      '<div class="body">'+
        (e.bio?'<p class="bio">'+esc(e.bio)+'</p>':'')+
        (e.bio_en?'<p class="bio en" lang="en">'+esc(e.bio_en)+'</p>':'')+
        (links?'<nav class="links">'+links+'</nav>':'')+
      '</div></section>';
    var first=app.querySelector('.links > :first-child');
    if(first){(first.classList.contains('call')?first.querySelector('button'):first).classList.add('primary')}
    var cb=app.querySelector('.callbtn');
    if(cb){cb.addEventListener('click',function(){
      var box=document.getElementById('phones'),open=cb.getAttribute('aria-expanded')==='true';
      cb.setAttribute('aria-expanded',String(!open));box.hidden=open;
    })}
    window.scrollTo(0,0);
  }

  function render(list){
    var id=hashId();
    if(!id){home(list);return}
    var e=list.filter(function(x){return String(x.id)===id})[0];
    if(!e){
      app.innerHTML='<a class="back" href="#">← Все сотрудники / All staff</a><p class="msg">Карточка не найдена.<br>Card not found.</p>';
      return;
    }
    card(e);
  }

  fetch('employees.json',{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){
      var list=d.employees||[];
      render(list);
      window.addEventListener('hashchange',function(){render(list)});
    })
    .catch(function(){app.innerHTML='<p class="msg">Не удалось загрузить данные.<br>Could not load data.</p>'});
})();
</script>
</body>
</html>
